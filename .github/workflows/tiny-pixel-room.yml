name: ドットのおへや

on:
  schedule:
    - cron: '17 15 * * *' # 毎日 00:17 (日本時間)
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tiny-pixel-room.yml

permissions:
  contents: write

concurrency:
  group: tiny-pixel-room

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: moppy626/tiny-pixel-room@v1
        with:
          character: cactus # turnip / sunflower / cactus
          pet-name: 'サボ子'
          language: ja # en (英語) / ja (日本語)
          # 非公開リポジトリも数えるときは、このシークレットにトークンを登録します。
          github-token: ${{ secrets.DOT_NO_OHEYA_TOKEN || github.token }}
